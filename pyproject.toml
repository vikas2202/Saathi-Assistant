[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "saathi-assistant"
version = "0.1.0"
description = "Local face recognition with a personalized cloud voice assistant"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "opencv-python>=4.11,<5",
  "Pillow>=11,<13",
  "openai>=2,<3",
  "sounddevice>=0.5,<0.6",
  "pyttsx3>=2.99,<3",
]

[project.optional-dependencies]
objects = ["ultralytics>=8.3,<9", "lap>=0.5.12"]

[project.scripts]
saathi = "saathi.__main__:main"

[tool.setuptools.packages.find]
include = ["saathi*"]
